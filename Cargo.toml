[package]
name = "infernal-librarian-simple"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[dependencies]
base64 = "0.22.1"
infernal-client-rs = { git = "https://github.com/BenjaminGrandstaff/infernal-client-rs", rev = "be3244add8899e253686cdccdf59d8ea71ea79ac" }
r2d2 = "0.8.10"
r2d2_postgres = "0.18.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
uuid = { version = "1.26.0", features = ["v4"] }
